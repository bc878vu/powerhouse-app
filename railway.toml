[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Launch the deterministic backend entrypoint directly.
startCommand = "cd backend && node boot.js"
# /test-cors is an existing lightweight backend endpoint and does not
# require the database, so Railway can verify the new deployment reliably.
healthcheckPath = "/test-cors"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
