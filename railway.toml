[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Always launch the deterministic backend entrypoint directly.
# This prevents an old/cached npm start command from bypassing
# the task compatibility router.
startCommand = "cd backend && node boot.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
